# Mirrors worker.js: security headers + cache policy + 404.html.
# Hash-routed SPA — unknown paths stay 404 (not index.html).
# Headers live in security-headers.conf (included per location).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json;

    error_page 404 /404.html;

    location = /manifest.json {
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ~* \.(html|js|css)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
